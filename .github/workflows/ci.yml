# Phase A minimal CI — pytest + prod Dockerfile build. No deploy / registry.
# See docs/ci_cd_plan.md Phase A and openspec/changes/v0-ci-and-v1-query-points/.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS required: tests/conftest.py CREATE EXTENSION postgis on wandr_test
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: wandr
          POSTGRES_PASSWORD: wandr
          POSTGRES_DB: wandr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wandr -d wandr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-test-secret-not-for-prod
      DATABASE_URL: postgresql+asyncpg://wandr:wandr@localhost:5432/wandr
      NOMINATIM_USER_AGENT: wandr-ci-tests
      LLM_API_KEY: ""
      REDIS_URL: ""
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      QDRANT_URL: http://localhost:6335
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Create wandr_test database
        run: |
          PGPASSWORD=wandr psql -h localhost -U wandr -d wandr -c "CREATE DATABASE wandr_test" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f Dockerfile .
