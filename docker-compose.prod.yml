# Production VPS — API + TLS proxy only.
# Data plane (PostGIS, Qdrant, Redis) is hosted; set env via .env.production.
# Local PostGIS/Qdrant: use root docker-compose.yml (dev-only).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: wandr-api:prod
    env_file:
      - .env.production
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
