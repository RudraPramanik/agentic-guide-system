# Production VPS — API + TLS proxy only.
# Data plane (PostGIS, Qdrant, Redis) is hosted; set env via .env.production.
# Local PostGIS/Qdrant/Redis/API: use root docker-compose.yml (dev-only).
#
# Usage: docker compose --env-file .env.production -f docker-compose.prod.yml up -d
# CI/CD sets WANDR_IMAGE to ghcr.io/<owner>/wandr-api:<sha> — do not build on 1GB VPS.

services:
  api:
    image: ${WANDR_IMAGE:-wandr-api:prod}
    # Local manual build only (not on VPS):
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    env_file:
      - .env.production
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      WANDR_API_HOST: ${WANDR_API_HOST:-api.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
